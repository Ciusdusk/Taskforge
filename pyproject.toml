[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "taskforge"
version = "0.1.0"
description = "A lightweight, single-machine async task execution tool."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20,<1",
    "pydantic>=2,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "typer>=0.12,<1",
]

[project.scripts]
taskforge = "taskforge.cli:main"

[project.optional-dependencies]
github = ["httpx>=0.28.1,<1"]

[dependency-groups]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/taskforge"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/integrations",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
    "/.python-version",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
files = ["src/taskforge", "integrations"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers --import-mode=importlib"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = [
    "integration: tests using real SQLite files, workers, or CLI processes",
]
